<!DOCTYPE html>
<html>
<head>
    <title>Biometric Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f7f6; }
        .btn { background: #28a745; color: white; border: none; padding: 20px 40px; border-radius: 12px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <img src="logo.jpeg" alt="school logo">
    <h2>Identity Verification</h2>
    <p>Tap the button below to use your phone's fingerprint sensor.</p>
    <button id="scanBtn" class="btn">Confirm Presence</button>

    <script>
        // 1. CHANGE THIS TO YOUR BOT USERNAME
        const BOT_USERNAME = "OsemhangbeBot"; 

        document.getElementById('scanBtn').onclick = async () => {
            try {
                // Mandatory WebAuthn challenge
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                // This triggers the NATIVE mobile browser biometric popup
                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "Attendance System" },
                        user: { id: new Uint8Array(16), name: "user", displayName: "User" },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { userVerification: "required" }
                    }
                });

                if (credential) {
                    // 2. REDIRECT back to Telegram with a success parameter
                    // This is the "Deep Link" that re-opens your bot automatically
                    window.location.href = `https://t.me/${BOT_USERNAME}?start=verified`;
                }
            } catch (err) {
                alert("Verification failed: " + err.message);
            }
        };
    </script>
</body>

</html>
